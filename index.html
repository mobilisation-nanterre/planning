<style>
/* Layout : bandeau d'en-tête + barre d'outils, puis une grille horaire (demi-heures × jours ou × salles) dans son propre conteneur défilant. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --ink:#17202b; --muted:#5b6674; --line:#e3e7ec; --line-strong:#c2cad4;
  --accent:#1d5d8a; --accent-ink:#ffffff; --block:#d6e7f4; --block-edge:#2d77ab; --block-ink:#0e3350;
  --warn:#c22a2a; --warn-bg:#fde8e8; --weekend:#eceff3; --today:#fff6d9; --plate:#17202b; --plate-ink:#ffffff;
  --hatch:rgba(45,119,171,.18); --shadow:0 10px 30px rgba(16,30,48,.18);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --row:26px; --nrows:30; --timecol:58px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151b; --surface:#181e26; --ink:#e7ebf0; --muted:#9ba6b2; --line:#252d37; --line-strong:#38424f;
  --accent:#72b4e6; --accent-ink:#0d1a26; --block:#1c3a53; --block-edge:#5aa2d8; --block-ink:#dcedfb;
  --warn:#ff7a7a; --warn-bg:#3b1d20; --weekend:#151a21; --today:#2a2717; --plate:#e7ebf0; --plate-ink:#11151b;
  --hatch:rgba(114,180,230,.16); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151b; --surface:#181e26; --ink:#e7ebf0; --muted:#9ba6b2; --line:#252d37; --line-strong:#38424f;
  --accent:#72b4e6; --accent-ink:#0d1a26; --block:#1c3a53; --block-edge:#5aa2d8; --block-ink:#dcedfb;
  --warn:#ff7a7a; --warn-bg:#3b1d20; --weekend:#151a21; --today:#2a2717; --plate:#e7ebf0; --plate-ink:#11151b;
  --hatch:rgba(114,180,230,.16); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* En-tête */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3vw,30px);margin:0;letter-spacing:-.01em;text-wrap:balance}
.topright{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.publink{font-size:13px;color:var(--accent)}
.propose{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.propose a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:#2f9e5b}.status.ro i{background:var(--accent)}.status.off i{background:var(--warn)}

/* Barre d'outils */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
@media (max-width:640px){.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.seg button{padding:7px 10px}}
.seg button+button{border-left:1px solid var(--line-strong)}
.bar:has(.viewpick){align-items:flex-end}
.fr-ctl{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;margin:6px 0 4px}
.fr-ctl label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.fr-ctl .field{min-width:110px}
.fr-h{margin:22px 0 10px;font-family:var(--f-display);font-size:15px;font-weight:600}
.fr-grp{margin:14px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.fr-room{display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line-strong);border-left:4px solid #2e9d5b;border-radius:8px;padding:9px 12px;cursor:pointer}
.fr-room:hover{border-color:#2e9d5b}
.fr-room:disabled{cursor:default}
.fr-room.busy{border-left-color:var(--warn);cursor:pointer}
.fr-room .n{font-weight:700}
.fr-room .m,.fr-room .x{font-size:13px;color:var(--muted)}
.fr-room.busy .x{color:var(--warn)}
.viewpick{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
.viewpick-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.nav{display:inline-flex;align-items:center;gap:6px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--ink)}

<script>
(() => {
const DEFAULT_BUILDING = "Paul Ricœur";
const slug = n => n.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase() || "salle";
const DEFAULT_ROOMS = [
  ["L R05","RDC",46],["L R15","RDC",120],["L R28","RDC",8],["Théâtre B.-M. Koltès","RDC",null],["Espace Pierre Reverdy","RDC",null],
  ["L 111","1er",52],["L 118","1er",48,"Salle de répétition"],["L 120 / L 121","1er",8],["L 125","1er",20],["L 128","1er",46],
  ["L 200","2e",60],["L 205","2e",44],["L 206","2e",42],["L 209","2e",28,"Salle de répétition"],["L 210","2e",44],["L 211","2e",40],["L 212","2e",null],["L 218","2e",90],["L 219","2e",36],
  ["L 306","3e",50],["L 307","3e",44],["L 308","3e",30],["L 310","3e",40],["L 311","3e",44],["L 312","3e",40],["L 313","3e",40],["L 318","3e",60],["L 321","3e",42,"Studio podcast"],
  ["L 418","4e",42],["L 419","4e",44,"Studio podcast"],["L 420","4e",46,"Studio podcast"],["L 421","4e",44],["Salle des conseils","4e",null]
].map(([n,e,c,u]) => ({id:slug(n),n,b:DEFAULT_BUILDING,e,c:c ?? null,u:u || ""}));
const FLOORS = ["RDC","1er","2e","3e","4e","Autre"];
const FLOOR_LABEL = {RDC:"Rez-de-chaussée","1er":"1er étage","2e":"2e étage","3e":"3e étage","4e":"4e étage",Autre:"Autre emplacement"};
const FLOOR_ALL = {RDC:"Tout le rez-de-chaussée","1er":"Tout le 1er étage","2e":"Tout le 2e étage","3e":"Tout le 3e étage","4e":"Tout le 4e étage",Autre:"Tous les autres emplacements"};
const sortRooms = list => list.slice().sort((a,b) => a.b.localeCompare(b.b, "fr") || FLOORS.indexOf(a.e) - FLOORS.indexOf(b.e) || a.n.localeCompare(b.n, "fr", {numeric:true}));
const buildings = () => [...new Set(ROOMS.map(r => r.b))];
const multiB = () => buildings().length > 1;
/* Groupes bâtiment × étage, dans l'ordre d'affichage. */
function groups(list){
  const out = [];
  for (const b of [...new Set(list.map(r => r.b))]) for (const e of FLOORS) {
    const rooms = list.filter(r => r.b === b && r.e === e);
    if (rooms.length) out.push({b, e, rooms, label: `${b} · ${FLOOR_LABEL[e]}`});
  }
  return out;
}
let ROOMS = sortRooms(DEFAULT_ROOMS), roomsFromDb = false, ROOM_BY_ID = {};
function indexRooms(){ ROOM_BY_ID = Object.fromEntries(ROOMS.map(r => [r.id, r])); }
indexRooms();
/* Une réservation désigne sa salle par son identifiant ; les plus anciennes, par nom (et bâtiment). */
const roomOf = it => ROOM_BY_ID[it.salleId] || ROOMS.find(r => r.n === it.salle && (!it.batiment || r.b === it.batiment)) || null;
/* Une réservation peut ne pas avoir de salle : elle n'entre alors dans aucun conflit. */
const hasRoom = it => !!(it.salleId || it.salle);
const keyOf = it => { if (!hasRoom(it)) return ""; const r = roomOf(it); return r ? r.id : "?" + (it.batiment || "") + "|" + it.salle; };
const nameOf = it => { const r = roomOf(it); return r ? r.n : it.salle; };
const batOf = it => { const r = roomOf(it); return r ? r.b : (it.batiment || ""); };
const place = (n, b) => `<span class="place"><span class="plate">${esc(n)}</span>${b ? `<span class="bat">${esc(b)}</span>` : ""}</span>`;
const placeOf = it => hasRoom(it) ? place(nameOf(it), batOf(it)) : `<span class="bat">Sans salle</span>`;
const placeText = it => hasRoom(it) ? `${nameOf(it)}${batOf(it) ? " (" + batOf(it) + ")" : ""}` : "sans salle";
const START = 8*60, END = 23*60, STEP = 30, NROWS = (END-START)/STEP;
const PERIOD = {from:"2026-10-18", to:"2026-11-15"};

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => addDays(d, -((d.getDay()+6)%7));
const toMin = s => { const [h,m] = String(s).split(":").map(Number); return h*60 + m; };
const hhmm = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const lab = m => `${Math.floor(m/60)}h${pad(m%60)}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fDow = new Intl.DateTimeFormat("fr-FR",{weekday:"short"});
const fDM = new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short"});
const fLong = new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const fShort = new Intl.DateTimeFormat("fr-FR",{weekday:"short",day:"2-digit",month:"2-digit"});
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};

const VIEWS = ["maintenant","jour","trois","cinq","semaine","liste","libres","salles"];
const STEP_DAYS = {trois: 3, cinq: 7, semaine: 7, jour: 1, libres: 1};

/* ---------- données ---------- */

  return { id: d.id, date: x.date, debut: x.debut, fin: x.fin, s, e, salle: String(x.salle || ""), salleId: typeof x.salleId === "string" ? x.salleId : "", batiment: String(x.batiment || ""), intitule: String(x.intitule || "Sans titre"),

           remarques: String(x.remarques || ""), auteur: typeof x.auteur === "string" ? x.auteur : null, modifieLe: x.modifieLe || null };

const active = () => state.items.filter(i => i.statut !== "Annulée");

function conflictIds(){
  const set = new Set(), act = active().map(a => ({...a, k: keyOf(a)}));
  for (let i = 0; i < act.length; i++) for (let j = i+1; j < act.length; j++) {

/* ---------- mise en page des blocs ---------- */
function lanes(evts){
  const list = evts.map(e => ({...e, s: Math.max(e.s, START), e2: Math.min(e.e, END)})).filter(e => e.e2 > e.s)
    .sort((a,b) => a.s - b.s || b.e2 - a.e2);
  const out = []; let cluster = [], ends = [], cEnd = -1;
  const flush = () => { const n = ends.length; cluster.forEach(x => x.n = n); out.push(...cluster); cluster = []; ends = []; cEnd = -1; };
  for (const ev of list) {
    if (cluster.length && ev.s >= cEnd) flush();
    let lane = ends.findIndex(t => t <= ev.s);
    if (lane < 0) { lane = ends.length; ends.push(ev.e2); } else ends[lane] = ev.e2;
    ev.lane = lane; cluster.push(ev); cEnd = Math.max(cEnd, ev.e2);
  }
  if (cluster.length) flush();
  return out;
}
function block(ev, conf, mode){
  const top = (ev.s - START) / STEP, h = (ev.e2 - ev.s) / STEP;
  const cls = ["ev", ev.statut === "Demandée" ? "req" : "", conf.has(ev.id) ? "conf" : ""].join(" ");
  const meta = mode === "jour" ? "" : placeOf(ev);
  const tip = `${ev.intitule}${ev.demandeur ? " – " + ev.demandeur : ""} – ${placeText(ev)} – ${lab(ev.s)} à ${lab(ev.e)}${ev.statut === "Demandée" ? " (demandée)" : ""}`;
  return `<button type="button" class="${cls}" data-id="${esc(ev.id)}" title="${esc(tip)}"
    style="top:calc(${top} * var(--row) + 1px);height:calc(${h} * var(--row) - 2px);left:calc(${ev.lane} * 100% / ${ev.n} + 2px);width:calc(100% / ${ev.n} - 4px)">
    <span class="ev-title">${esc(ev.intitule)}</span>
    ${ev.demandeur ? `<span class="ev-who">${esc(ev.demandeur)}</span>` : ""}
    <span class="ev-meta">${meta}<span class="ev-time">${lab(ev.s)}–${lab(ev.e)}</span></span></button>`;
}
function timeCol(){
  let h = `<div class="times">`;
  for (let i = 0; i < NROWS; i++) { const m = START + i*STEP; h += `<div class="tl ${m % 60 ? "" : "h"}">${lab(m)}</div>`; }
  return h + `</div>`;
}
function nowLine(dISO){
  if (dISO !== iso(new Date())) return "";

function renderAgenda(){

/* Recherche : tous les mots tapés doivent apparaître (sans tenir compte des accents ni des majuscules)
   dans l'intitulé, l'intervenant-e, la salle, le bâtiment ou les remarques. Elle porte sur tout le planning. */
const fold = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function hilite(text, words){
  const t = String(text || ""), f = fold(t);

  for (const w of words) { let i = f.indexOf(w); while (i >= 0) { for (let k = i; k < i + w.length; k++) marks[k] = true; i = f.indexOf(w, i + w.length); } }

  for (let k = 0; k < t.length; k++) { if (marks[k] !== open) { out += marks[k] ? "<mark>" : "</mark>"; open = marks[k]; } out += esc(t[k]); }

function renderSearch(){
  const words = fold(state.q).split(/\s+/).filter(Boolean), conf = conflictIds();

  const hits = active().filter(it => { const h = hay(it); return words.every(w => h.includes(w)); });

  const past = hits.filter(isPast).sort((a,b) => b.date.localeCompare(a.date) || b.s - a.s);

  $("count").textContent = hits.length ? `${coming.length} à venir · ${past.length} passé${past.length>1?"s":""}` : "Aucun résultat";
  if (!hits.length) return `<div class="ag-empty"><div class="empty">Aucun événement ne correspond à « ${esc(state.q.trim())} ». Essayez un autre mot, ou effacez la recherche pour revenir au planning.</div></div>`;

    const cls = ["ag-item", ev.statut === "Demandée" ? "req" : "", conf.has(ev.id) ? "conf" : "", isPast(ev) ? "past" : ""].join(" ");
    const remHit = ev.remarques && words.some(w => fold(ev.remarques).includes(w));
    return `<button type="button" class="${cls}" data-id="${esc(ev.id)}">
      <span class="ag-time"><b>${lab(ev.s)}</b><br>${lab(ev.e)}</span>
      <span class="ag-card">
        <span class="ev-title">${hilite(ev.intitule, words)}</span>
        ${ev.demandeur ? `<span class="ev-who">${hilite(ev.demandeur, words)}</span>` : ""}
        <span class="ev-meta">${hasRoom(ev) ? `<span>${hilite(nameOf(ev), words)}</span>${batOf(ev) ? `<span>${hilite(batOf(ev), words)}</span>` : ""}` : `<span>Sans salle</span>`}${ev.statut === "Demandée" ? `<span>Demandée</span>` : ""}${conf.has(ev.id) ? `<span>Conflit de salle</span>` : ""}</span>
        ${remHit ? `<span class="sr-rem">${hilite(ev.remarques.length > 160 ? ev.remarques.slice(0, 160) + "…" : ev.remarques, words)}</span>` : ""}
      </span></button>`;
  };
  const byDay = list => { let h = "", d = null, buf = []; const flush = () => { if (buf.length) h += `<h2 class="sr-day">${esc(cap1(fLong.format(parse(d))))}</h2><div class="agenda">${buf.join("")}</div>`; buf = []; };
    for (const ev of list) { if (ev.date !== d) { flush(); d = ev.date; } buf.push(item(ev)); } flush(); return h; };

/* Un événement est passé quand son heure de fin est dépassée. */

function render(){

/* Mises à jour automatiques à h55, de 6h55 à 22h55. On laisse 20 minutes à chacune pour aboutir,
   et on tolère un passage manqué : l'alerte n'apparaît qu'après deux passages manqués d'affilée. */
function lastRun(at){
  const d = new Date(at); d.setSeconds(0, 0);
  if (d.getMinutes() < 55) d.setHours(d.getHours() - 1);
  d.setMinutes(55);
  while (d.getHours() < 6 || d.getHours() > 22) d.setHours(d.getHours() - 1, 55);
  return d;
}
function isStale(t0){
  const ref = lastRun(Date.now() - 20 * 60000), prev = lastRun(ref.getTime() - 60000);
  return t0.getTime() < prev.getTime() - 10 * 60000;
}
function setStatus(){
  const s = $("status"), t = $("statusText"), nb = $("notice");
  s.className = "status";
  if (state.dbState === "loading") { t.textContent = "Chargement…"; nb.hidden = true; return; }
  if (state.dbState === "off") {
    s.classList.add("off"); t.textContent = "Réservations indisponibles";
    nb.className = "notice warn"; nb.hidden = false;
    nb.textContent = "Les réservations ne s'affichent que pour les personnes connectées à Claude et invitées sur cette page. Connectez-vous, puis rechargez la page.";
    return;
  }
  nb.hidden = true;
  if (state.dbState === "snapshot") {
    const t0 = SNAP && SNAP.genere ? new Date(SNAP.genere) : null;
    s.classList.add("ro");
    nb.className = "notice"; nb.hidden = false;
    nb.textContent = "Planning en consultation seule, mis à jour automatiquement toutes les heures, de 7h à 23h.";
    /* Les mises à jour automatiques partent à h55 : on affiche l'heure pile qu'elles préparent. Une mise à jour manuelle garde son heure réelle. */
    const shown = t0 && !isNaN(t0) ? new Date(t0) : null;
    if (shown && shown.getMinutes() >= 50) { shown.setHours(shown.getHours() + 1, 0, 0, 0); }
    t.textContent = shown ? `Consultation · mis à jour le ${shown.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})} à ${shown.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}).replace(":","h")}` : "Consultation";
    if (shown && isStale(t0)) {
      const h = shown.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}).replace(":","h");
      const when = iso(shown) === iso(new Date()) ? h : `le ${shown.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})} à ${h}`;
      s.className = "status off"; nb.className = "notice warn";
      nb.textContent = `Attention : ce planning n'a pas été mis à jour depuis ${when}. Des changements récents peuvent manquer.`;
    }
    return;
  }
  if (state.canWrite) { s.classList.add("ok"); t.textContent = "Vous pouvez réserver"; }
  else { s.classList.add("ro"); t.textContent = "Consultation"; }
}

  if (typeof extConflictsOf === "function") out = out.concat(extConflictsOf(rec).map(x => ({s: x.s, e: x.e, t: "Planning de la mobilisation", id: ""})));

        const linked = state.items.filter(i => keyOf(i) === room.id);
        await state.db.doc("salles/" + room.id).set(body);
        if (room.n !== nom || room.b !== batiment || linked.some(i => i.salleId !== room.id))
          for (const it of linked) await state.db.doc("reservations/" + it.id).update({salleId: room.id, salle: nom, batiment, modifieLe: new Date().toISOString()});
      } else await state.db.collection("salles").add(body);
      closeSheet(); toast(room ? "Salle modifiée" : "Salle ajoutée");
    } catch (err) { $("roomSave").disabled = false; say(writeError(err)); }
  });
  const del = $("roomDel"); let armed = false;
  if (del) del.addEventListener("click", async () => {
    if (!armed) {
      armed = true; del.classList.add("armed"); del.textContent = "Confirmer la suppression";
      if (nRes) say(`${nRes} réservation${nRes>1?"s":""} concerne${nRes>1?"nt":""} cette salle. Elle${nRes>1?"s":""} restera dans la liste mais n'apparaîtr${nRes>1?"ont":"a"} plus dans la vue Jour.`);
      return;
    }
    del.disabled = true;
    try {
      await ensureRoomsInDb();
      await state.db.doc("salles/" + room.id).delete();
      await markDeleted("salle", room.id);
      if (state.filter === "room:" + room.id) { state.filter = "all"; store.set("ric.filter", "all"); }
      closeSheet(); toast("Salle supprimée");
    } catch (err) { del.disabled = false; say(writeError(err)); }
  });
}
/* La liste par défaut n'existe que dans la page tant que la base est vide : on l'y enregistre avant la première modification. */
async function ensureRoomsInDb(){
  if (roomsFromDb) return;
  for (const r of DEFAULT_ROOMS) {
    await state.db.doc("salles/" + r.id).set({nom: r.n, batiment: r.b, etage: r.e, capacite: r.c, usage: r.u});
  }
  ROOMS = sortRooms(DEFAULT_ROOMS); roomsFromDb = true;
}

/* Trace des suppressions, lue par la mise à jour de la page publique (qui ne relit que les changements). */
async function markDeleted(type, id){
  try { await state.db.doc("suppressions/" + id).set({type, at: new Date().toISOString()}); } catch {}
}
function writeError(err){
  const code = err && err.code;
  if (code === "invalid_argument") { state.canWrite = false; setStatus(); render(); return "Vous n'avez pas le droit de modifier ce planning. Demandez au propriétaire de vous inviter avec le droit « Peut modifier »."; }
  if (code === "quota_exceeded") return "Le planning a atteint sa capacité maximale. Supprimez d'anciennes réservations puis réessayez.";
  if (code === "revoked" || code === "not_granted") return "Votre accès à cette page a changé. Rechargez la page.";
  return "L'enregistrement n'a pas abouti. Vérifiez votre connexion et réessayez.";
}

/* ---------- événements ---------- */
document.querySelector(".seg").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]"); if (!b) return;
  state.view = b.dataset.view; store.set("ric.vue4", state.view); if (state.q) { state.q = ""; $("q").value = ""; } render();
});
$("prev").addEventListener("click", () => { state.date = addDays(state.date, -(STEP_DAYS[state.view] || 7)); render(); });
$("next").addEventListener("click", () => { state.date = addDays(state.date, STEP_DAYS[state.view] || 7); render(); });
$("todayBtn").addEventListener("click", () => { state.date = parse(iso(new Date())); render(); });
$("pick").addEventListener("change", e => { if (e.target.value) { state.date = parse(e.target.value); render(); } });
let qTimer = null;
$("q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value.trim() ? e.target.value : ""; render(); }, 150); });
$("q").addEventListener("keydown", e => { if (e.key === "Escape" && e.target.value) { e.target.value = ""; state.q = ""; render(); } });
$("filter").addEventListener("change", e => { state.filter = e.target.value; store.set("ric.filter", state.filter); render(); });
$("addBtn").addEventListener("click", () => {
  if (state.view === "salles") return roomForm(null);
  const room = state.filter.startsWith("room:") ? state.filter.slice(5) : "";
  form(null, { date: iso(state.date), salleId: room });
});
$("view").addEventListener("click", e => {
  if (e.target.closest("#fsBtn")) {
    const v = $("view");
    try { if (document.fullscreenElement) document.exitFullscreen(); else v.requestFullscreen().catch(() => toast("Le plein écran n'est pas disponible ici.")); } catch { toast("Le plein écran n'est pas disponible ici."); }
    return;
  }
  if (document.fullscreenElement && e.target.closest("[data-id]")) { try { document.exitFullscreen(); } catch {} }
  const re = e.target.closest("[data-room-edit]");
  if (re) { const r = ROOM_BY_ID[re.dataset.roomEdit]; if (r) roomForm(r); return; }
  const b = e.target.closest("[data-id]");
  if (b) { const it = state.items.find(i => i.id === b.dataset.id); if (it) details(it); return; }
  const col = e.target.closest(".col");
  if (col && state.canWrite && e.target === col) {
    const y = e.clientY - col.getBoundingClientRect().top;
    const row = Math.max(0, Math.min(NROWS - 1, Math.floor(y / (col.clientHeight / NROWS))));
    const s = START + row * STEP;
    const room = col.dataset.room || (state.filter.startsWith("room:") ? state.filter.slice(5) : "");
    form(null, { date: col.dataset.date, debut: hhmm(s), fin: hhmm(Math.min(s + 120, END)), salleId: room });
  }
});
sheetEl.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return closeSheet();
  const ed = e.target.closest("[data-edit]");
  if (ed) { const it = state.items.find(i => i.id === ed.dataset.edit); if (it) form(it); }
});
$("backdrop").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheetEl.hidden) closeSheet(); });
setInterval(() => { if (sheetEl.hidden && state.view in STEP_DAYS) render(); }, 5 * 60 * 1000);
setInterval(() => { if (sheetEl.hidden && state.view === "maintenant") render(); }, 30 * 1000);
document.addEventListener("fullscreenchange", () => { if (state.view === "maintenant") render(); });
setInterval(() => { if (state.dbState === "snapshot") setStatus(); }, 5 * 60 * 1000);
let wasNarrow = narrow();
window.addEventListener("resize", () => { const n = narrow(); if (n !== wasNarrow) { wasNarrow = n; if (state.view === "jour" && sheetEl.hidden) render(); } });

/* ---------- mise à jour de la page publique (propriétaire uniquement) ---------- */
const PUBLISH_TASK = "trig_01D7x9E5ad8SVaUMk6VqL7Q6", REMOTE = "Claude Code Remote";
async function setupPublishButton(){
  const mcp = window.claude ? await window.claude.use("mcp") : null;
  if (!mcp) return;
  const b = $("pubBtn"); b.hidden = false;
  b.addEventListener("click", async () => {
    b.disabled = true; b.textContent = "Mise à jour lancée…";
    try {
      await mcp.callTool(REMOTE, "fire_trigger", {trigger_id: PUBLISH_TASK, text: "Mise à jour lancée depuis le bouton de la page de gestion."}, {cache: false});
      toast("Mise à jour lancée : la page publique sera à jour d'ici deux à trois minutes.");
    } catch (err) {
      const c = err && err.code;
      toast(c === "server_not_connected" || c === "needs_reauth" ? "Le connecteur « Claude Code Remote » n'est pas disponible : vérifiez-le dans les réglages de claude.ai."
        : c === "approval_required" || c === "not_in_manifest" || c === "consent_required" ? "Lancement refusé : autorisez la page à utiliser « Claude Code Remote », puis recliquez."
        : c === "tool_error" ? "La tâche de mise à jour a refusé le lancement. Réessayez dans quelques minutes."
        : "La demande n'a peut-être pas abouti. Vérifiez l'heure de mise à jour sur la page publique avant de recliquer.");
    } finally {
      setTimeout(() => { b.disabled = false; b.textContent = "Mettre à jour la page publique"; }, 4000);
    }
  });
}

/* ---------- démarrage ---------- */
function parseRoom(d){
  const x = d.data() || {}, n = String(x.nom || "").trim();
  return n ? {id: d.id, n, b: String(x.batiment || "").trim() || DEFAULT_BUILDING, e: FLOORS.includes(x.etage) ? x.etage : "Autre", c: Number(x.capacite) > 0 ? Number(x.capacite) : null, u: String(x.usage || "")} : null;
}
function setRooms(list){ roomsFromDb = list.length > 0; ROOMS = roomsFromDb ? sortRooms(list) : sortRooms(DEFAULT_ROOMS); indexRooms(); }
/* Copie publique : les données sont intégrées à la page (window.__SNAPSHOT), en lecture seule. */
const SNAP = window.__SNAPSHOT || null;
buildFilter(); setStatus(); render();
if (SNAP) {
  const asDoc = x => ({id: x.id, data: () => x.data});
  setRooms((SNAP.salles || []).map(asDoc).map(parseRoom).filter(Boolean));
  state.items = (SNAP.reservations || []).map(asDoc).map(clean).filter(Boolean);
  state.dbState = "snapshot"; state.canWrite = false;
  /* La vue Salles sert à gérer les salles : inutile sur la page publique. */
  $("v-salles").remove();
  $("v-libres").remove();
  if (state.view === "libres") state.view = "jour";
  $("propose").hidden = false;
  if (state.view === "salles") state.view = "jour";
  buildFilter(); setStatus(); render();
} else (async () => {
  const c = window.claude;
  const [db, user] = await Promise.all([c ? c.use("db") : null, c ? c.use("user") : null]);
  state.user = user;
  $("pubLink").hidden = false;
  if (user && await user.isOwner()) setupPublishButton();
  if (!db) { state.dbState = "off"; setStatus(); render(); return; }
  state.db = db;
  if (user) {
    state.myId = await user.id();
    const can = await user.can("data.write");
    state.canWrite = can === null ? await user.canEdit() || !!state.myId : can;
  }
  db.collection("salles").onSnapshot(snap => { setRooms(snap.docs.map(parseRoom).filter(Boolean)); buildFilter(); render(); }, () => {});
  db.collection("reservations").onSnapshot(snap => {
    state.items = snap.docs.map(clean).filter(Boolean);
    state.dbState = "ok"; setStatus();
    render();
  }, err => {
    state.dbState = err && err.code === "revoked" ? "off" : "ok"; setStatus(); render();
  });
})();
})();
</script>
